name: Mobile release publish

# Triggered when a release-prepare PR is merged. The merge commit's message
# begins with "release(mobile): vX.Y.Z" — that's how we filter pushes to main.
#
# Order: assert secrets → move tag onto merge commit → build ios+android (in
# parallel) → submit each → create GitHub Release.

on:
  push:
    branches:
      - main

jobs:
  guard:
    name: Guard (verify release commit + secrets)
    # `contains` (not `startsWith`) so this fires regardless of merge strategy:
    # default merge commits put the PR title in the body, while squash/rebase
    # put it on the first line.
    if: "${{ contains(github.event.head_commit.message, 'release(mobile): v') }}"
    runs_on: linux-medium
    # Job-level env: step-level `env:` does not interpolate ${{ }} expressions.
    env:
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        name: Parse version from commit message
        # Default merge commits put the PR title on a body line, not the first
        # line — so scan the whole message for the release marker.
        run: |
          VERSION=$(printf '%s' "$COMMIT_MSG" | sed -nE 's/.*release\(mobile\): v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Could not parse version from commit message:" >&2
            printf '%s\n' "$COMMIT_MSG" >&2
            exit 1
          fi
          echo "Version: $VERSION"
          set-output version "$VERSION"

      - name: Assert RELEASE_GH_TOKEN is set
        run: |
          if [ -z "${{ env.RELEASE_GH_TOKEN }}" ]; then
            echo "EAS project secret RELEASE_GH_TOKEN is missing." >&2
            echo "Add a GitHub PAT (contents:write, pull-requests:read) under EAS → project → environment variables." >&2
            exit 1
          fi

  move_tag:
    name: Move tag onto merge commit
    needs: [guard]
    runs_on: linux-medium
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      RELEASE_GH_TOKEN: ${{ env.RELEASE_GH_TOKEN }}
    steps:
      - uses: eas/checkout

      - name: Force-move tag onto HEAD
        # The original tag pointed at the developer's pre-bump commit; we move
        # it to the merge commit so the GitHub Release is built from the
        # actually-released tree.
        #
        # eas/checkout already set up origin; we inject the token via an
        # Authorization header instead of rewriting the remote URL, which would
        # require knowing owner/repo (${{ github.repository }} is unavailable here).
        run: |
          git config user.name "entangle-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          AUTH_HEADER="Authorization: Basic $(printf 'x-access-token:%s' "$RELEASE_GH_TOKEN" | base64 -w0)"
          git tag -f "v${VERSION}-mobile"
          git -c "http.extraheader=${AUTH_HEADER}" push -f origin "v${VERSION}-mobile"

  build_ios:
    name: Build iOS (production)
    needs: [move_tag]
    type: build
    params:
      platform: ios
      profile: production
      message: 'Mobile v${{ needs.guard.outputs.version }}'

  build_android:
    name: Build Android (production)
    needs: [move_tag]
    type: build
    params:
      platform: android
      profile: production
      message: 'Mobile v${{ needs.guard.outputs.version }}'

  submit_ios:
    name: Submit iOS to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  submit_android:
    name: Submit Android to Play Console
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  github_release:
    name: Create GitHub Release
    # `needs` for guard (version output) and build_android (build_id, used to
    # fetch the secondary universal-APK artifact). `after` for the submit jobs
    # so the Release still publishes even if a store submission flakes — the
    # binaries are already built and can be resubmitted.
    needs: [guard, build_android]
    after: [submit_ios, submit_android]
    runs_on: linux-medium
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      ANDROID_BUILD_ID: ${{ needs.build_android.outputs.build_id }}
      GH_TOKEN: ${{ env.RELEASE_GH_TOKEN }}
    steps:
      - uses: eas/checkout

      - name: Install gh CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            (type -p wget >/dev/null || sudo apt-get install -y wget) \
              && sudo mkdir -p -m 755 /etc/apt/keyrings \
              && wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null \
              && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null \
              && sudo apt-get update \
              && sudo apt-get install -y gh
          fi

      - name: Download universal APK from build artifacts
        # Best-effort: the AAB build's `eas-build-pre-upload-artifacts` hook
        # produces a universal signed APK alongside the AAB (see
        # scripts/extract-universal-apk.mjs). `buildArtifactsUrl` is a presigned
        # tar.gz of everything under buildArtifactPaths — we untar and grab the
        # APK. eas-cli must run from the project dir (apps/mobile) to resolve the
        # EAS project; eas/checkout lands us at the monorepo root. Any failure
        # here skips the APK rather than failing the Release (the default shell
        # is `set -eo pipefail`, so capture to a file and guard every step).
        run: |
          mkdir -p release-assets
          ( cd apps/mobile && npx -y eas-cli@latest build:view "${ANDROID_BUILD_ID}" --json --non-interactive ) > build.json 2>/dev/null || true
          URL=$(jq -r '.artifacts.buildArtifactsUrl // empty' build.json 2>/dev/null || true)
          if [ -z "$URL" ]; then
            echo "No secondary artifacts for build ${ANDROID_BUILD_ID} — skipping APK attachment."
            exit 0
          fi
          curl -fsSL -o build-artifacts.tar.gz "$URL" || { echo "APK download failed — skipping attachment."; exit 0; }
          tar -xzf build-artifacts.tar.gz -C release-assets --strip-components=1 || true
          ls -la release-assets

      - name: Create release
        # gh infers --repo from the local git remote that eas/checkout configures,
        # which avoids depending on ${{ github.repository }} (unavailable here).
        # Passing release-assets/*.apk attaches the universal APK if present;
        # the glob expands to nothing (and gh ignores it) if the hook was skipped.
        run: |
          shopt -s nullglob
          APKS=(release-assets/*.apk)
          gh release create "v${VERSION}-mobile" \
            --title "Mobile v${VERSION}" \
            --generate-notes \
            --verify-tag \
            "${APKS[@]}"
